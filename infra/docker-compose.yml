services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: rba
      POSTGRES_PASSWORD: rba
      POSTGRES_DB: rba
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rba -d rba"]
      interval: 5s
      timeout: 5s
      retries: 12
