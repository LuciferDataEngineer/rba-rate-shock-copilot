name: CI

on:
  push:
    branches: [main, feat/rate-shock-copilot]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[dev,dbt,orch]"
      - name: Lint
        run: ruff check src tests
      - name: Unit tests
        run: pytest -q
      - name: Tidy snapshot
        run: python -m rba_copilot.pipeline
      - name: Contracts
        run: python -m rba_copilot.contracts
      - name: dbt
        working-directory: transform
        run: dbt build --profiles-dir .
      - name: Headline checks
        run: python -m rba_copilot.headline
      - name: Dashboard
        run: python -m rba_copilot.dashboard
      - name: Dagster definitions
        run: dagster definitions validate -m rba_copilot.orchestration
      - name: Install OpenTofu
        uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: 1.8.8
      - name: OpenTofu
        working-directory: infra/tofu
        run: |
          tofu init -backend=false
          tofu validate

  retrieval:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: rba
          POSTGRES_PASSWORD: rba
          POSTGRES_DB: rba
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rba -d rba"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql://rba:rba@localhost:5432/rba
      HF_HOME: ${{ github.workspace }}/.cache/huggingface
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Cache embedding model
        uses: actions/cache@v4
        with:
          path: .cache/huggingface
          key: hf-minilm-l6-v2
      - name: Install
        run: |
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install -e ".[dev,rag]"
      - name: Tidy chunks
        run: python -m rba_copilot.pipeline
      - name: Index and evaluate
        run: |
          python -m rba_copilot.rag.index
          python -m rba_copilot.rag.evaluate
          python -m rba_copilot.rag.answer
